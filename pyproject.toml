[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "options-research-engine"
version = "0.1.0"
description = "Bias-aware options research engine for LEAPS and earnings long-call studies."
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "yfinance>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
options-research = "options_research.cli:main"
options-live-scan = "options_research.live_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
